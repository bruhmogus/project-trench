# Служба безопасности тяжелой зоны

- type: entity
  parent: [BaseScpHeadset, BaseSecurityLawyerContraband]
  id: ClothingHeadsetHeavyContainmentSecurityService
  name: heavy containment security headset
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyHeavyContainmentSecurityService
  - type: Sprite
    sprite: Clothing/Ears/Headsets/security.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/security.rsi

